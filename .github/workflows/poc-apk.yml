name: FlyAI POC APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "POC versionCode（默认 6）"
        required: false
        default: "6"
      version_name:
        description: "POC versionName（默认 1.5）"
        required: false
        default: "1.5"
      overlay_only:
        description: "只生成 overlay + 清单（true，默认，日常代码更新）；改到 APK/依赖时选 false"
        required: false
        default: "true"
  push:
    tags:
      - "poc-*"

permissions:
  contents: read

concurrency:
  group: poc-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  POC_VERSION_CODE: ${{ inputs.version_code || '6' }}
  POC_VERSION_NAME: ${{ inputs.version_name || '1.5' }}
  POC_OVERLAY_VERSION: ${{ github.run_number }}
  # 手动触发用版本号+run；push tag 时沿用触发它的 tag
  POC_TAG: ${{ github.event_name == 'workflow_dispatch' && format('poc-v{0}-{1}', inputs.version_name || '1.5', github.run_number) || github.ref_name }}

jobs:
  build:
    # ubuntu-latest 已切到 26.04，actions/python-versions 还没有 3.9 的 26.04 包；
    # 钉在 24.04 以保留 Python 3.9（项目语法约束）。
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Set up Node
        if: inputs.overlay_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 21
        if: inputs.overlay_only != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: inputs.overlay_only != 'true'
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        if: inputs.overlay_only != 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        if: inputs.overlay_only != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Restore cached base rootfs
        id: rootfs_cache
        uses: actions/cache@v4
        with:
          path: |
            .poc-cache/base
            .poc-cache/proot
          # 依赖不变就复用 base rootfs；requirements.txt 变化时自动重建
          key: poc-rootfs-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-v3

      - name: Install arm64 binfmt (cache miss)
        if: inputs.overlay_only != 'true' && steps.rootfs_cache.outputs.cache-hit != 'true'
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Build base rootfs via Docker (cache miss)
        if: inputs.overlay_only != 'true' && steps.rootfs_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # 用 Docker 内的完整 /dev 与 DNS（宿主 chroot 的 /dev、DNS 在 CI 上不可靠）
          set -euo pipefail
          WORK="$RUNNER_TEMP/poc-base"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          bash mobile/poc/fetch-proot.sh "$WORK"
          bash mobile/poc/build-rootfs-docker.sh "$WORK" "$PWD"
          mkdir -p .poc-cache/base .poc-cache/proot
          sudo cp "$WORK/rootfs.tar.gz" .poc-cache/base/rootfs.tar.gz
          sudo cp "$WORK/proot-pkg/data/data/com.termux/files/usr/bin/proot" .poc-cache/proot/proot
          sudo cp "$WORK/proot-pkg/data/data/com.termux/files/usr/libexec/proot/loader" .poc-cache/proot/loader
          sudo cp "$WORK/proot-pkg/data/data/com.termux/files/usr/lib/libtalloc.so.2.5.0" .poc-cache/proot/libtalloc.so.2
          sudo cp "$WORK/proot-pkg/data/data/com.termux/files/usr/lib/libandroid-shmem.so" .poc-cache/proot/libandroid-shmem.so
          sudo chown -R "$USER:$USER" .poc-cache

      # 构建完立即落缓存：后续步骤失败时也不至于白跑 30 分钟
      - name: Save base rootfs cache
        if: inputs.overlay_only != 'true' && steps.rootfs_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .poc-cache/base
            .poc-cache/proot
          key: poc-rootfs-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-v3

      - name: Install mobile dependencies
        if: inputs.overlay_only != 'true'
        run: cd mobile && npm ci

      - name: Decode signing keystore
        if: inputs.overlay_only != 'true'
        env:
          POC_KEYSTORE_B64: ${{ secrets.POC_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$POC_KEYSTORE_B64" ]; then
            echo "::error::缺少 Secrets.POC_KEYSTORE_B64（poc-release.jks 的 base64）"
            exit 1
          fi
          printf '%s' "$POC_KEYSTORE_B64" | base64 -d > mobile/poc-release.jks

      - name: Build POC APK
        if: inputs.overlay_only != 'true'
        env:
          FLYAI_STORE_PASSWORD: ${{ secrets.POC_STORE_PASSWORD }}
          FLYAI_KEY_PASSWORD: ${{ secrets.POC_KEY_PASSWORD }}
          FLYAI_KEY_ALIAS: ${{ secrets.POC_KEY_ALIAS }}
          # GitHub runner 直连官方 Gradle / Maven 更稳，不走国内镜像
          POC_GRADLE_MIRROR: https://services.gradle.org/distributions/gradle-8.11.1-all.zip
          POC_NO_CN_MIRRORS: "1"
        run: |
          python mobile/poc/build_poc.py \
            --version-code "$POC_VERSION_CODE" \
            --version-name "$POC_VERSION_NAME"

      - name: Generate OTA overlay and signed manifest
        env:
          POC_OTA_SIGNING_KEY: ${{ secrets.POC_OTA_SIGNING_KEY }}
          OVERLAY_ONLY: ${{ inputs.overlay_only }}
        run: |
          set -euo pipefail
          if [ -z "$POC_OTA_SIGNING_KEY" ]; then
            echo "::error::缺少 Secrets.POC_OTA_SIGNING_KEY（OTA RSA 私钥 PEM 的 base64）"
            exit 1
          fi
          printf '%s' "$POC_OTA_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/poc-ota.key"
          APK_ARGS=()
          if [ "$OVERLAY_ONLY" != "true" ]; then
            APK=$(ls release/FlyAI-POC-arm64-v*.apk | head -1)
            APK_ARGS=(--apk "$APK")
          fi
          python mobile/poc/build_overlay.py \
            --version-code "$POC_VERSION_CODE" \
            --version-name "$POC_VERSION_NAME" \
            --overlay-version "$POC_OVERLAY_VERSION" \
            --tag "$POC_TAG" \
            --repo-url "https://github.com/${{ github.repository }}" \
            "${APK_ARGS[@]}" \
            --key "$RUNNER_TEMP/poc-ota.key"

      - name: Write job summary
        if: always()
        env:
          OVERLAY_ONLY: ${{ inputs.overlay_only }}
        run: |
          APK=$(ls release/FlyAI-POC-arm64-v*.apk 2>/dev/null | head -1 || true)
          OVERLAY=$(ls release/poc-overlay-*.tar.gz 2>/dev/null | head -1 || true)
          {
            echo "## FlyAI POC"
            echo ""
            if [ -n "$APK" ]; then
              echo "- APK：\`$APK\`"
              echo "- 体积：$(du -h "$APK" | cut -f1)"
              echo "- SHA256：\`$(sha256sum "$APK" | cut -d' ' -f1)\`"
              echo "- versionCode=$POC_VERSION_CODE versionName=$POC_VERSION_NAME"
            elif [ "$OVERLAY_ONLY" = "true" ]; then
              echo "- 模式：仅 overlay（未编译 APK）"
            else
              echo "构建失败，未生成 APK。"
            fi
            if [ -n "$OVERLAY" ]; then
              echo "- overlay：\`$OVERLAY\`（$(du -h "$OVERLAY" | cut -f1)）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and OTA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlyAI-POC-arm64-v${{ env.POC_VERSION_NAME }}
          path: |
            release/FlyAI-POC-arm64-v*.apk
            release/poc-overlay-*.tar.gz
            release/poc-update.json
            release/FlyAI-POC-update-*.zip
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/poc-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: FlyAI-POC-arm64-v${{ env.POC_VERSION_NAME }}
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.POC_TAG }}
          name: FlyAI POC ${{ env.POC_VERSION_NAME }}
          make_latest: true
          files: |
            artifacts/FlyAI-POC-arm64-v*.apk
            artifacts/poc-overlay-*.tar.gz
            artifacts/poc-update.json
            artifacts/FlyAI-POC-update-*.zip
