<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · FlyAI</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-page { width: 100%; max-width: 380px; }
    .login-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 16px; padding: 28px 26px; box-shadow: 0 12px 40px rgba(0,0,0,0.18); }
    .login-card .logo { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .login-card .sub { color: var(--text-dim); font-size: 13px; margin: 0 0 18px; }
    .login-card label.f-label { margin: 10px 0; }
    .login-card .btn.primary { width: 100%; padding: 11px; font-size: 15px; margin-top: 8px; }
    .login-hint { margin-top: 14px; font-size: 12px; color: var(--text-dim); text-align: center; }
    .icp-footer { margin: 16px 0 0; text-align: center; }
    .icp-footer a { font-size: 12px; color: var(--text-dim); text-decoration: none; }
  </style>
</head>
<body class="theme-dark">
  <div class="login-page">
    <div class="login-card">
      <div class="logo"><span class="dot"></span>FlyAI</div>
      <p class="sub">本地 AI 聊天工具</p>

      <label class="f-label">用户名
        <input type="text" id="login-name" placeholder="输入用户名" autocomplete="username" />
      </label>
      <label class="f-label">密码
        <input type="password" id="login-password" placeholder="密码（可留空）" autocomplete="current-password" />
      </label>
      <div id="login-msg" class="msg-bar"></div>
      <button id="btn-login" class="btn primary">登 录</button>
      <p class="login-hint">管理员请使用 config 中设置的管理员账号登录；普通用户由管理员创建</p>
    </div>
    <p class="icp-footer"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">冀ICP备2025098938号-2</a></p>
  </div>

  <script>
    var $ = function (id) { return document.getElementById(id); };

    function login() {
      var name = $("login-name").value.trim();
      var password = $("login-password").value;
      var msg = $("login-msg");
      msg.className = "msg-bar";
      if (!name) { msg.textContent = "请输入用户名"; msg.className = "msg-bar err"; return; }
      fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, password: password }),
      }).then(function (r) {
        if (!r.ok) return r.json().then(function (b) { throw new Error(b.detail || "登录失败"); });
        return r.json();
      }).then(function (res) {
        localStorage.setItem("flyai-token", res.token);
        localStorage.setItem("flyai-uid", res.id);
        localStorage.setItem("flyai-role", res.role || "user");
        localStorage.setItem("flyai-level", String(res.level == null ? 0 : res.level));
        window.location.href = "/";
      }).catch(function (e) {
        msg.textContent = "登录失败: " + e.message;
        msg.className = "msg-bar err";
      });
    }

    $("btn-login").addEventListener("click", login);
    $("login-password").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); login(); }
    });
    $("login-name").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); $("login-password").focus(); }
    });
  </script>
</body>
</html>
