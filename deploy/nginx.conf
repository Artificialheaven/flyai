# FlyAI 站点配置（宝塔面板 / nginx 反向代理）
#
# 部署要点：
# 1. 本文件替换宝塔站点配置：/www/server/panel/vhost/nginx/flyai.eastcloud.top.conf
# 2. 新增的两个正则 location 必须位于 proxy include 之前。
# 3. 反向代理文件（/www/server/panel/vhost/nginx/proxy/flyai.eastcloud.top/*.conf）
#    中如果存在 `location ^~ /static/`，需要去掉 `^~` 改成 `location /static/`，
#    否则 nginx 会跳过正则匹配，长缓存不生效。
# 4. proxy_pass 的后端地址按实际部署修改（默认 127.0.0.1:8000）。
#
# 生效：
#   sudo nginx -t && sudo systemctl reload nginx
# 验证：
#   curl -sI https://flyai.eastcloud.top/static/js/main.e721a58f.js | grep -i -E 'cache-control|expires'
#     期望 cache-control: max-age=31536000
#   curl -sI https://flyai.eastcloud.top/ | grep -i cache-control
#     期望 no-cache

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name flyai.eastcloud.top;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/flyai.eastcloud.top;
    # 角色卡默认 50MB，管理面板最高可调到 200MB；这里留出 multipart 开销
    client_max_body_size 256m;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/flyai.eastcloud.top.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/flyai.eastcloud.top/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/flyai.eastcloud.top/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/flyai.eastcloud.top/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443"; h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    #清理缓存规则

    location ~ /purge(/.*) {
        proxy_cache_purge cache_one $host$1$is_args$args;
        #access_log  /www/wwwlogs/flyai.eastcloud.top_purge_cache.log;
    }

    # ===== 构建产物长缓存 START =====
    # rspack 产物文件名带 8 位 contenthash（main.e721a58f.js、4936.5c06760e.js、
    # KaTeX_*.1608a09b.woff2），URL 与内容一一对应，可以放心长期缓存。
    # 必须放在下面的 proxy include 之前：nginx 的 true-regex location 按出现顺序匹配，
    # 放前面才能优先于代理文件里可能存在的其它正则规则。
    # 注意：正则里的 {8} 必须用引号包住，否则 nginx 会把 { 当成块起始符导致解析失败
    location ~ "^/static/.+\.[0-9a-f]{8}\.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif)$" {
        # 后端地址与反向代理文件里的 proxy_pass 保持一致（默认 8000）
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 覆盖上游 FastAPI 的 Cache-Control: no-cache
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires 365d;
    }

    # 音色文件（应用层本来就声明了 immutable，这里保持一致）
    location ~ "^/static/.+\.sf2$" {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires 365d;
    }
    # ===== 构建产物长缓存 END =====

    #引用反向代理规则，注释后配置的反向代理将无效
    include /www/server/panel/vhost/nginx/proxy/flyai.eastcloud.top/*.conf;

    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用，修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/flyai.eastcloud.top.conf;
    #REWRITE-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }



    access_log  /www/wwwlogs/flyai.eastcloud.top.log;
    error_log  /www/wwwlogs/flyai.eastcloud.top.error.log;
}
